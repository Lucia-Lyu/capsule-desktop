  <rect x="400" y="478" width="19" height="19" rx="6" fill="#fff" stroke="#a9b8ab"/>
  <text x="433" y="493" fill="#405247" font-family="Segoe UI, Arial, sans-serif" font-size="16">Take a walk</text>
  <text x="400" y="542" fill="#648471" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">＋ Add task</text>
  <line x1="400" y1="560" x2="679" y2="560" stroke="#e8eee7"/>
  <text x="400" y="586" fill="#85998a" font-family="Segoe UI, Arial, sans-serif" font-size="14">Eye 18m</text>
  <text x="494" y="586" fill="#85998a" font-family="Segoe UI, Arial, sans-serif" font-size="14">Water 32m</text>
  <text x="599" y="586" fill="#85998a" font-family="Segoe UI, Arial, sans-serif" font-size="14">Stand 48m</text>
  <text x="400" y="620" fill="#698273" font-family="Segoe UI, Arial, sans-serif" font-size="13">History</text>
  <text x="622" y="620" fill="#698273" font-family="Segoe UI, Arial, sans-serif" font-size="13">Settings</text>

  <path d="M720 374h50" fill="none" stroke="#9eb1a4" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="792" y="248" fill="#829387" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">A GENTLE NUDGE</text>
  <rect x="782" y="275" width="408" height="227" rx="24" fill="#fbfcfa" stroke="#d4ded3" filter="url(#shadow)"/>
  <circle cx="825" cy="318" r="21" fill="#edf3ec"/>
  <path d="M813 318c6-8 18-8 24 0-6 8-18 8-24 0Z" fill="none" stroke="#5f806b" stroke-width="2"/>
  <circle cx="825" cy="318" r="3" fill="#5f806b"/>
  <text x="858" y="325" fill="#3d5144" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Eye break</text>
  <text x="811" y="377" fill="#728477" font-family="Segoe UI, Arial, sans-serif" font-size="16">Look away from the screen for 20 seconds.</text>
  <rect x="811" y="420" width="164" height="47" rx="13" fill="#e9f2e9"/>
  <text x="867" y="449" fill="#4f765a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Done</text>
  <rect x="988" y="420" width="173" height="47" rx="13" fill="#f4f6f2" stroke="#dce6db"/>
  <text x="1019" y="449" fill="#6d826f" font-family="Segoe UI, Arial, sans-serif" font-size="16">10m later</text>
  <text x="792" y="540" fill="#819287" font-family="Segoe UI, Arial, sans-serif" font-size="15">Reminders appear without a full app window.</text>

  <path d="M718 618h40v88h15" fill="none" stroke="#9eb1a4" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="792" y="585" fill="#829387" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOOK BACK</text>
  <rect x="782" y="606" width="408" height="235" rx="24" fill="#fbfcfa" stroke="#dfe8de" filter="url(#shadow)"/>
  <text x="810" y="643" fill="#3d5144" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">History</text>
  <text x="1100" y="641" fill="#728477" font-family="Segoe UI, Arial, sans-serif" font-size="13">Last 7 days</text>
  <line x1="810" y1="656" x2="1162" y2="656" stroke="#e8eee7"/>
  <text x="810" y="683" fill="#526958" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Oct 13</text>
  <text x="810" y="703" fill="#839486" font-family="Segoe UI, Arial, sans-serif" font-size="13">Tasks 4/5</text>
  <text x="1018" y="703" fill="#839486" font-family="Segoe UI, Arial, sans-serif" font-size="13">Health 15/17</text>
  <line x1="810" y1="714" x2="1162" y2="714" stroke="#edf1eb"/>
  <text x="810" y="740" fill="#526958" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Oct 12</text>
  <text x="810" y="760" fill="#839486" font-family="Segoe UI, Arial, sans-serif" font-size="13">Tasks 5/5</text>
  <text x="1018" y="760" fill="#839486" font-family="Segoe UI, Arial, sans-serif" font-size="13">Health 14/16</text>
  <line x1="810" y1="771" x2="1162" y2="771" stroke="#edf1eb"/>
  <text x="810" y="797" fill="#526958" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Oct 11</text>
  <text x="810" y="817" fill="#839486" font-family="Segoe UI, Arial, sans-serif" font-size="13">Tasks 3/4</text>
  <text x="1018" y="817" fill="#839486" font-family="Segoe UI, Arial, sans-serif" font-size="13">Health 12/15</text>

  <line x1="64" y1="866" x2="1216" y2="866" stroke="#dfe8de"/>
  <text x="64" y="890" fill="#8b9b8e" font-family="Segoe UI, Arial, sans-serif" font-size="12">Concept illustration · Capsule v0.1 · Built with Tauri, React, Rust, and SQLite</text>
</svg>
