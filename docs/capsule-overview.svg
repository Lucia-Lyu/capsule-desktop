  <path d="m405 364 4 4 6-8" fill="none" stroke="#608b6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="433" y="370" fill="#9aaa9d" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-decoration="line-through">Reply to email</text>
  <rect x="400" y="396" width="19" height="19" rx="6" fill="#eaf3eb" stroke="#93b39c"/>
  <path d="m405 405 4 4 6-8" fill="none" stroke="#608b6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="433" y="411" fill="#9aaa9d" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-decoration="line-through">Write memo</text>
