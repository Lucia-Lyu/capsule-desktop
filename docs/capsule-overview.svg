<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title description">
  <title id="title">Capsule desktop app overview</title>
  <desc id="description">An illustration of Capsule's compact desktop pill, today's task list, centered healthy break reminder, and recent task and health history.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#263b32" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#9eb1a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="900" fill="#f5f7f3"/>
  <circle cx="1168" cy="88" r="168" fill="#eaf0e9"/>
  <circle cx="78" cy="825" r="155" fill="#edf1eb"/>
  <rect x="64" y="48" width="36" height="36" rx="18" fill="#5f806b"/>
  <path d="M75 66h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="115" y="77" fill="#30473a" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Capsule</text>
  <text x="64" y="126" fill="#405649" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Tasks and healthy breaks, in a tiny desktop companion.</text>
  <text x="64" y="160" fill="#778a7b" font-family="Segoe UI, Arial, sans-serif" font-size="17">Local-first · No account · Always close at hand</text>

  <text x="92" y="248" fill="#829387" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">GLANCE</text>
  <rect x="84" y="275" width="205" height="60" rx="30" fill="#fbfcfa" stroke="#dfe8de" filter="url(#shadow)"/>
  <path d="M116 305c7-9 19-9 26 0-7 9-19 9-26 0Z" fill="none" stroke="#60816b" stroke-width="2"/>
  <circle cx="129" cy="305" r="3.5" fill="#60816b"/>
  <text x="152" y="311" fill="#3e5145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">18m</text>
  <path d="M211 293v24" stroke="#dce5dd"/>
  <text x="229" y="311" fill="#3e5145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">3/5</text>
  <text x="92" y="367" fill="#819287" font-family="Segoe UI, Arial, sans-serif" font-size="15">A small pill at the screen edge.</text>

  <path d="M306 305h56" fill="none" stroke="#9eb1a4" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>

  <text x="386" y="215" fill="#829387" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ONE CLICK</text>
  <rect x="376" y="236" width="327" height="405" rx="24" fill="#fbfcfa" stroke="#dfe8de" filter="url(#shadow)"/>
  <text x="400" y="277" fill="#87988b" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">TODAY</text>
  <text x="649" y="277" fill="#4c6252" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">3 / 5</text>
  <line x1="400" y1="293" x2="679" y2="293" stroke="#e8eee7"/>

  <rect x="400" y="314" width="19" height="19" rx="6" fill="#eaf3eb" stroke="#93b39c"/>
